# Release for quack-proxy: cut a tag (vX.Y.Z) and this builds cross-platform
# binaries, checksums them, and publishes a GitHub Release with the assets.
#
# Usage:
#   git tag v0.2.0 && git push origin v0.2.0
#
# No manual publishing step: `go install .../cmd/quack-proxy@latest` and the
# Releases page both track the newest tag automatically.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        - { os: linux,   arch: amd64 }
        - { os: linux,   arch: arm64 }
        - { os: darwin,  arch: amd64 }
        - { os: darwin,  arch: arm64 }
        - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "quack-proxy-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}${suffix}" \
            ./cmd/quack-proxy

      - name: Smoke (native build reports its version)
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          out="$(./quack-proxy-${GITHUB_REF_NAME}-linux-amd64 version)"
          echo "binary reports: $out"
          [ "$out" = "quack-proxy ${GITHUB_REF_NAME}" ] || { echo "version mismatch"; exit 1; }

      - name: Package
        run: |
          base="quack-proxy-${GITHUB_REF_NAME}-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -q "${base}.zip" "${base}.exe"
          else
            tar czf "${base}.tar.gz" "${base}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: "quack-proxy-${{ GITHUB_REF_NAME }}-${{ matrix.os }}-${{ matrix.arch }}.*"

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum quack-proxy-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          # --generate-notes summarizes the commits since the previous tag,
          # so release notes are written automatically (no hand editing).
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --files quack-proxy-* --files SHA256SUMS
